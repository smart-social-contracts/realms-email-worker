<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background:#f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding: 24px 16px;">
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%; background:#ffffff; border-radius:8px; overflow:hidden; border:1px solid #e5e7eb;">
          <tr>
            <td style="padding:16px 24px; background:#ffffff; border-bottom:1px solid #e5e7eb;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                <tr>
                  {% if logo_url %}
                  <td style="vertical-align:middle; padding-right:12px;">
                    <img src="{{ logo_url }}" alt="{{ realm_name }}" width="40" height="40" style="display:block; width:40px; height:40px; border-radius:50%; border:0;">
                  </td>
                  {% endif %}
                  <td style="vertical-align:middle;">
                    <span style="font-size:20px; font-weight:500; color:#374151;">{{ realm_name }}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding: 32px;">
              <h1 style="margin:0 0 16px; font-size:22px; line-height:1.3; color:#111827;">Voting reminder</h1>
              <p style="margin:0 0 24px; font-size:16px; line-height:1.6; color:#374151;">{{ message }}</p>
              {% if href %}
              <p style="margin:0;">
                <a href="{{ href }}" style="display:inline-block; padding:12px 24px; background:#3b82f6; color:#ffffff; text-decoration:none; border-radius:8px; font-weight:600;">Cast your vote</a>
              </p>
              {% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding: 16px 24px; text-align:center; border-top:1px solid #e5e7eb; color:#6b7280; font-size:12px; line-height:1.5;">
              Sent by {{ realm_name }} via Realms GOS.<br>
              Manage your email preferences in your Realms settings.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
